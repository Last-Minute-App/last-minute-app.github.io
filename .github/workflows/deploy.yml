name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Past landing bugs (missing link previews, dead footer links, double
      # slashes, "deal" wording, un-ignored .env) must not ship again. Runs
      # before the build so a failure stops the deploy. Python is preinstalled.
      - name: Guard — past landing bugs stay fixed
        run: python3 scripts/check-landing.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci, not npm install: the lockfile is now committed, so every
      # deploy installs the EXACT tree that was tested. Before this, each
      # deploy re-resolved from scratch — a transitive release could change
      # (or break, or compromise) the live landing page with no commit here.
      # --legacy-peer-deps because CRA's peer graph still needs it; the ajv
      # pair that used to be installed by hand afterwards is now declared in
      # package.json and locked, so that step is gone.
      - name: Install dependencies (locked)
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4