<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Discover local, time-limited offers from shops near you — and help good food and unsold stock find someone instead of a bin." />
        <link rel="canonical" href="https://tiphop.gr/" />

        <!-- Link previews. A local marketplace spreads by people sending each
             other the link — on Viber, WhatsApp and Messenger above all. With
             no Open Graph tags a shared link renders as a bare grey URL: no
             name, no picture, nothing to click for. These are what turn a
             pasted link into something that looks like the product. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="tiphop" />
        <meta property="og:url" content="https://tiphop.gr/" />
        <meta property="og:title" content="tiphop — local offers, before they’re gone" />
        <meta property="og:description" content="Time-limited offers from shops near you. Save money, and help good food find someone instead of a bin." />
        <meta property="og:image" content="https://tiphop.gr/tiphop_logo.png" />
        <meta property="og:image:alt" content="tiphop" />
        <meta property="og:locale" content="el_GR" />
        <meta property="og:locale:alternate" content="en_GB" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="tiphop — local offers, before they’re gone" />
        <meta name="twitter:description" content="Time-limited offers from shops near you. Save money, and help good food find someone instead of a bin." />
        <meta name="twitter:image" content="https://tiphop.gr/tiphop_logo.png" />

        <!-- GitHub Pages cannot set response headers, so the policies that can
             be expressed in a meta tag are set here. X-Frame-Options has no
             meta equivalent; frame-ancestors is the CSP form and does the same
             job in browsers that honour it. -->
        <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <link rel="icon" type="image/png" href="%PUBLIC_URL%/tiphop_logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>tiphop — local offers, before they’re gone</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
        <!-- Analytics: intentionally NONE.
             PostHog (product analytics + session replay) was removed on
             2026-09-05 by the owner's decision. It loaded unconditionally on
             page load, set a cookie and a persistent visitor id, and recorded
             sessions on a page that carries a contact form (name, email,
             message) — with no consent step, for EU pilot users, to a US
             endpoint.

             That is also WHY there is no cookie banner: with this gone the
             site stores nothing beyond what it strictly needs, which is exempt
             from consent under GDPR/ePrivacy. If any third-party tracking or
             ads are ever added here, a consent mechanism has to come back with
             them (the CookieConsent component is kept, unused, in the app repo
             for exactly that). -->
    </body>
</html>
